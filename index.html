<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo - 2010 Edition</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #4b4b4b; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { width: 960px; max-width: 95%; margin: 0 auto; flex: 1; }
        .header { display: flex; justify-content: flex-end; padding-top: 30px; gap: 10px; }
        .header input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 140px; }
        .btn-green { background: linear-gradient(#92d41e, #76b800); border: 1px solid #659e00; border-radius: 5px; color: #fff; font-weight: bold; font-size: 14px; padding: 8px 22px; cursor: pointer; }
        .main-content { margin-top: 40px; padding-left: 20px; }
        .brand-row { display: flex; align-items: flex-start; gap: 20px; }
        .tagline { font-size: 20px; color: #555; margin-top: 10px; }
        .beta-text { margin-top: 5px; font-size: 19px; line-height: 1.4; }
        .beta-text a { color: #4b75b3; text-decoration: none; font-weight: bold; }
        .learn-now-wrapper { margin-top: 30px; }
        .btn-learn-now { font-size: 18px; padding: 12px 32px; }
        #language-section, #levels-section { display: none; margin-top: 35px; border-top: 1px solid #eee; padding: 25px 0 40px; }
        .languages-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .lang-card { border: 1px solid #ddd; border-radius: 5px; padding: 15px 10px; text-align: center; cursor: pointer; background: #fafafa; font-weight: bold; }
        .lang-card:hover { border-color: #76b800; background: #f2f9e6; }
        .section-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .levels-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; max-height: 360px; overflow-y: auto; padding: 10px; border: 1px solid #e0e0e0; background: #fafafa; }
        .level-btn { padding: 10px 5px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: bold; font-size: 13px; cursor: pointer; }
        .level-btn.hard { border-color: #e6a100; }
        .level-btn.expert { border-color: #d9534f; }
        .level-btn.completed { background: #76b800; color: #fff; border-color: #659e00; }
        #lesson-section { display: none; margin: 35px 0 40px; border: 1px solid #ccc; border-radius: 6px; padding: 25px; background: #fcfcfc; max-width: 600px; }
        .lesson-header { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .diff-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .lesson-word { font-size: 21px; font-weight: bold; margin: 12px 0 16px; color: #222; }
        .lesson-input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; }
        .feedback { margin-top: 15px; font-weight: bold; }
        .link-btn { background: none; border: none; color: #4b75b3; cursor: pointer; text-decoration: underline; }
        .footer { text-align: right; padding: 20px; font-size: 12px; color: #888; }
        @media (max-width: 768px) { .languages-grid { grid-template-columns: repeat(2, 1fr); } .levels-grid { grid-template-columns: repeat(5, 1fr); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <input type="text" placeholder="Username" id="username">
        <input type="password" placeholder="Password" id="password">
        <button type="button" class="btn-green" onclick="handleLogin()">Login</button>
    </div>
    <div class="main-content">
        <div class="brand-row">
            <svg width="95" height="95" viewBox="0 0 120 120" xmlns="http://w3.org">
                <path d="M45 102 L45 112 M40 112 L50 112 M45 108 L38 114 M45 108 L52 114 M68 102 L68 112 M63 112 L73 112 M68 108 L61 114 M68 108 L75 114" stroke="#8b6c4c" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M26 55 Q12 65 24 85 Q32 78 32 65 Z M88 55 Q105 62 110 72 Q95 82 84 72 Z M28 20 L42 32 Q57 28 72 32 L86 20 Q92 55 86 85 Q80 104 57 104 Q34 104 28 85 Q22 55 28 20 Z" fill="#8b6c4c"/>
                <circle cx="43" cy="52" r="13" fill="#fff" stroke="#8b6c4c" stroke-width="2"/><circle cx="43" cy="52" r="7.5" fill="#8b6c4c"/><text x="43" y="55.5" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">d</text>
                <circle cx="71" cy="52" r="13" fill="#fff" stroke="#8b6c4c" stroke-width="2"/><circle cx="71" cy="52" r="7.5" fill="#8b6c4c"/><text x="71" y="55.5" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">o</text>
                <path d="M53 56 L53 63 Q57 68 61 63 L61 56 M40 78 Q45 84 50 78 M52 78 Q57 84 62 78 M64 78 Q69 84 74 78 M46 87 Q51 93 56 87 M58 87 Q63 93 68 87" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="tagline">Duolingo is the new way to learn languages.</div>
        </div>
        <div class="beta-text">We're currently in closed beta.<br>Follow us on Twitter (<a href="https://twitter.com" target="_blank">@duolingo</a>) for updates.</div>
        <div class="learn-now-wrapper"><button type="button" class="btn-green btn-learn-now" onclick="openLanguages()">Learn Now</button></div>

        <div id="language-section"><h2>Which language do you want to learn? (10 Languages)</h2><div class="languages-grid" id="languages-grid"></div></div>
        <div id="levels-section"><div class="section-top-bar"><h2 id="levels-title" style="margin:0;"></h2><button type="button" class="link-btn" onclick="openLanguages()">← Back to Languages</button></div><div class="levels-grid" id="levels-grid"></div></div>
        <div id="lesson-section">
            <div class="lesson-header"><strong id="lesson-title" style="font-size:18px;color:#76b800;"></strong><button type="button" class="link-btn" onclick="backToLevels()">← Back to 200 Levels</button></div>
            <div id="diff-badge" class="diff-badge"></div>
            <div id="lesson-prompt">Translate this into English:</div>
            <div class="lesson-word" id="lesson-word"></div>
            <input type="text" class="lesson-input" id="user-answer" placeholder="Write your translation...">
            <button type="button" class="btn-green" onclick="checkAnswer()">Check Answer</button>
            <button type="button" class="btn-green" style="background:#6c9a14;margin-left:8px;" onclick="nextLevel()">Next Level →</button>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>
</div>
<div class="footer">© 2010 Carnegie Mellon University</div>
<script>
const languages = [
    { name: "Spanish",
      easy: [{q:"Hola",a:"hello"},{q:"Agua",a:"water"},{q:"Pan",a:"bread"},{q:"Gato",a:"cat"},{q:"Casa",a:"house"}],
      med: [{q:"Quiero beber agua fría",a:"i want to drink cold water"},{q:"El gato negro duerme en la casa",a:"the black cat sleeps in the house"},{q:"Nosotros leemos libros interesantes",a:"we read interesting books"}],
      hard: [{q:"Translate to Spanish: She always speaks fast",a:"ella siempre habla rapido"},{q:"Translate to Spanish: We need more time today",a:"necesitamos mas tiempo hoy"}] },
    { name: "French",
      easy: [{q:"Bonjour",a:"hello"},{q:"Eau",a:"water"},{q:"Pain",a:"bread"},{q:"Chat",a:"cat"},{q:"Maison",a:"house"}],
      med: [{q:"Je veux boire de l'eau froide",a:"i want to drink cold water"},{q:"Le chat noir dort dans la maison",a:"the black cat sleeps in the house"},{q:"Nous lisons des livres intéressants",a:"we read interesting books"}],
      hard: [{q:"Translate to French: She always speaks fast",a:"elle parle toujours vite"},{q:"Translate to French: We need more time today",a:"nous avons besoin de plus de temps aujourd'hui"}] },
    { name: "German",
      easy: [{q:"Hallo",a:"hello"},{q:"Wasser",a:"water"},{q:"Brot",a:"bread"},{q:"Katze",a:"cat"},{q:"Haus",a:"house"}],
      med: [{q:"Ich möchte kaltes Wasser trinken",a:"i want to drink cold water"},{q:"Die schwarze Katze schläft im Haus",a:"the black cat sleeps in the house"},{q:"Wir lesen interessante Bücher",a:"we read interesting books"}],
      hard: [{q:"Translate to German: She always speaks fast",a:"sie spricht immer schnell"},{q:"Translate to German: We need more time today",a:"wir brauchen heute mehr zeit"}] },
    { name: "Italian",
      easy: [{q:"Ciao",a:"hello"},{q:"Acqua",a:"water"},{q:"Pane",a:"bread"},{q:"Gatto",a:"cat"},{q:"Casa",a:"house"}],
      med: [{q:"Voglio bere acqua fredda",a:"i want to drink cold water"},{q:"Il gatto nero dorme in casa",a:"the black cat sleeps in the house"},{q:"Leggiamo libri interessanti",a:"we read interesting books"}],
      hard: [{q:"Translate to Italian: She always speaks fast",a:"lei parla sempre velocemente"},{q:"Translate to Italian: We need more time today",a:"abbiamo bisogno di piu tempo oggi"}] },
    { name: "Portuguese",
      easy: [{q:"Olá",a:"hello"},{q:"Água",a:"water"},{q:"Pão",a:"bread"},{q:"Gato",a:"cat"},{q:"Casa",a:"house"}],
      med: [{q:"Eu quero beber água fria",a:"i want to drink cold water"},{q:"O gato preto dorme na casa",a:"the black cat sleeps in the house"},{q:"Nós lemos livros interessantes",a:"we read interesting books"}],
      hard: [{q:"Translate to Portuguese: She always speaks fast",a:"ela sempre fala rapido"},{q:"Translate to Portuguese: We need more time today",a:"precisamos de mais tempo hoje"}] }
];
    languages.push(
    { name: "Greek",
      easy: [{q:"Γεια σου",a:"hello"},{q:"Νερό",a:"water"},{q:"Ψωμί",a:"bread"},{q:"Γάτα",a:"cat"},{q:"Σπίτι",a:"house"}],
      med: [{q:"Θέλω να πιω κρύο νερό",a:"i want to drink cold water"},{q:"Η μαύρη γάτα κοιμάται στο σπίτι",a:"the black cat sleeps in the house"}],
      hard: [{q:"Translate to Greek: She always speaks fast",a:"αυτη μιλαει παντα γρηγορα"},{q:"Translate to Greek: We need more time today",a:"χρειαζομαστε περισσοτερο χρονο σημερα"}] },
    { name: "Japanese",
      easy: [{q:"こんにちは (Konnichiwa)",a:"hello"},{q:"水 (Mizu)",a:"water"},{q:"パン (Pan)",a:"bread"},{q:"猫 (Neko)",a:"cat"},{q:"家 (Ie)",a:"house"}],
      med: [{q:"冷たい水が飲みたいです (Tsumetai mizu ga nomitai desu)",a:"i want to drink cold water"},{q:"黒い猫は家で寝ています (Kuroi neko wa ie de neteimasu)",a:"the black cat sleeps in the house"}],
      hard: [{q:"Translate to Japanese (Romaji): Thank you very much",a:"arigatou gozaimasu"},{q:"Translate to Japanese (Romaji): Good morning",a:"ohayou gozaimasu"}] },
    { name: "Russian",
      easy: [{q:"Привет (Privet)",a:"hello"},{q:"Вода (Voda)",a:"water"},{q:"Хлеб (Khleb)",a:"bread"},{q:"Кот (Kot)",a:"cat"},{q:"Дом (Dom)",a:"house"}],
      med: [{q:"Я хочу пить холодную воду (Ya khochu pit kholodnuyu vodu)",a:"i want to drink cold water"},{q:"Чёрный кот спит в доме (Chyorny kot spit v dome)",a:"the black cat sleeps in the house"}],
      hard: [{q:"Translate to Russian (Latin): Thank you very much",a:"bolshoye spasibo"},{q:"Translate to Russian (Latin): Good morning",a:"dobroye utro"}] },
    { name: "Korean",
      easy: [{q:"안녕하세요 (Annyeonghaseyo)",a:"hello"},{q:"물 (Mul)",a:"water"},{q:"빵 (Ppang)",a:"bread"},{q:"고양이 (Goyangi)",a:"cat"},{q:"집 (Jip)",a:"house"}],
      med: [{q:"차가운 물을 마시고 싶어요 (Chagaun mureul masigo sipeoyo)",a:"i want to drink cold water"},{q:"검은 고양이가 집에서 잡니다 (Geomeun goyangiga jibeseo jamnida)",a:"the black cat sleeps in the house"}],
      hard: [{q:"Translate to Korean (Romanized): Thank you",a:"gamsahamnida"},{q:"Translate to Korean (Romanized): Good night",a:"jal jayo"}] },
    { name: "Dutch",
      easy: [{q:"Hallo",a:"hello"},{q:"Water",a:"water"},{q:"Brood",a:"bread"},{q:"Kat",a:"cat"},{q:"Huis",a:"house"}],
      med: [{q:"Ik wil koud water drinken",a:"i want to drink cold water"},{q:"De zwarte kat slaapt in het huis",a:"the black cat sleeps in the house"}],
      hard: [{q:"Translate to Dutch: She always speaks fast",a:"zij praat altijd snel"},{q:"Translate to Dutch: We need more time today",a:"wij hebben vandaag meer tijd nodig"}] }
);

let selectedLang = 0, selectedLevel = 1, completed = {}, currentQ = null;
const langGrid = document.getElementById("languages-grid");
languages.forEach((l, i) => {
    const d = document.createElement("div");
    d.className = "lang-card";
    d.innerHTML = l.name + "<br><span style='font-size:11px;color:#76b800;'>200 Progressive Levels</span>";
    d.onclick = () => selectLanguage(i);
    langGrid.appendChild(d);
});
function openLanguages() {
    document.getElementById("levels-section").style.display = "none";
    document.getElementById("lesson-section").style.display = "none";
    document.getElementById("language-section").style.display = "block";
}
function selectLanguage(i) {
    selectedLang = i;
    document.getElementById("language-section").style.display = "none";
    document.getElementById("lesson-section").style.display = "none";
    document.getElementById("levels-section").style.display = "block";
    document.getElementById("levels-title").innerText = languages[i].name + " - Choose Level (1-50 Easy, 51-120 Medium, 121-200 Hard)";
    const grid = document.getElementById("levels-grid");
    grid.innerHTML = "";
    for (let lvl = 1; lvl <= 200; lvl++) {
        const b = document.createElement("button");
        b.type = "button";
        let tier = lvl <= 50 ? "" : (lvl <= 120 ? " hard" : " expert");
        b.className = "level-btn" + tier + (completed[languages[i].name + "_" + lvl] ? " completed" : "");
        b.innerText = "Lvl " + lvl;
        b.onclick = () => startLevel(lvl);
        grid.appendChild(b);
    }
}
function startLevel(lvl) {
    selectedLevel = lvl;
    const l = languages[selectedLang];
    const badge = document.getElementById("diff-badge");
    const prompt = document.getElementById("lesson-prompt");
    if (lvl <= 50) {
        currentQ = l.easy[(lvl - 1) % l.easy.length];
        badge.style.background = "#76b800"; badge.innerText = "BEGINNER (Level " + lvl + ")";
        prompt.innerText = "Translate this word into English:";
    } else if (lvl <= 120) {
        currentQ = l.med[(lvl - 51) % l.med.length];
        badge.style.background = "#e6a100"; badge.innerText = "INTERMEDIATE SENTENCE (Level " + lvl + ")";
        prompt.innerText = "Translate the full sentence into English:";
    } else {
        currentQ = l.hard[(lvl - 121) % l.hard.length];
        badge.style.background = "#d9534f"; badge.innerText = "EXPERT REVERSE CHALLENGE (Level " + lvl + ")";
        prompt.innerText = "Write the exact translation (no accents needed):";
    }
    document.getElementById("levels-section").style.display = "none";
    document.getElementById("lesson-section").style.display = "block";
    document.getElementById("lesson-title").innerText = l.name + " — Level " + lvl + " / 200";
    document.getElementById("lesson-word").innerText = '"' + currentQ.q + '"';
    document.getElementById("user-answer").value = "";
    document.getElementById("feedback").innerText = "";
}
function backToLevels() { selectLanguage(selectedLang); }
function normalize(str) {
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?']/g, "").trim();
}
function checkAnswer() {
    const l = languages[selectedLang];
    const ans = normalize(document.getElementById("user-answer").value);
    const fb = document.getElementById("feedback");
    if (ans === normalize(currentQ.a)) {
        fb.style.color = "#76b800"; fb.innerText = "Correct! Level " + selectedLevel + " mastered!";
        completed[l.name + "_" + selectedLevel] = true;
    } else {
        fb.style.color = "#d9534f"; fb.innerText = 'Incorrect. Expected: "' + currentQ.a + '"';
    }
}
function nextLevel() { if (selectedLevel < 200) startLevel(selectedLevel + 1); else backToLevels(); }
function handleLogin() { alert("Welcome to Duolingo Closed Beta (2010), " + (document.getElementById("username").value || "Guest") + "!"); }
</script>
</body>
</html>
